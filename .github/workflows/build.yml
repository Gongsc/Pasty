name: 构建与发布

# unpackaged 的 WinUI 3 应用：构建产物是整个输出目录（自包含，含 Windows App SDK 运行时），
# 打成 zip 供人下载，打 tag 时再挂到 GitHub Release 上。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: 构建 Windows x64
    runs-on: windows-latest
    permissions:
      contents: write # 打 tag 时创建 Release 需要写权限
    env:
      OUT_DIR: Pasty/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原依赖
        run: dotnet restore Pasty/Pasty.csproj

      - name: 构建（Release / x64）
        run: dotnet build Pasty/Pasty.csproj -c Release -p:Platform=x64 --no-restore

      - name: 打包为 zip
        shell: pwsh
        run: |
          # 版本号只认 csproj 里的 <Version>，产物名、Release 标题都从它派生
          $ver = Select-Xml -Path 'Pasty/Pasty.csproj' -XPath '/Project/PropertyGroup/Version' |
            ForEach-Object { $_.Node.'#text' } | Select-Object -First 1
          if (-not $ver) { throw '读不到 csproj 里的 <Version>' }
          if (-not (Test-Path "$env:OUT_DIR/Pasty.exe")) { throw "构建产物缺失：$env:OUT_DIR/Pasty.exe" }

          # 发版时标签必须和 csproj 版本对上，否则 Release 标题与实际程序版本会长期错位
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$ver") {
            throw "标签 $env:GITHUB_REF_NAME 与 csproj 版本 v$ver 不一致"
          }

          $zip = "Pasty-v$ver-win-x64.zip"
          Compress-Archive -Path "$env:OUT_DIR/*" -DestinationPath $zip -CompressionLevel Optimal
          "VERSION=$ver" >> $env:GITHUB_ENV
          "ZIP=$zip" >> $env:GITHUB_ENV
          Write-Host "已打包 $zip（$([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB）"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Pasty-v${{ env.VERSION }}-win-x64
          path: ${{ env.ZIP }}
          if-no-files-found: error

      - name: 发布到 GitHub Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME $env:ZIP `
            --title "Pasty v$env:VERSION" --generate-notes
